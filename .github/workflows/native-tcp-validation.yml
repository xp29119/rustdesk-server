name: Native TCP compatibility validation

on:
  push:
    branches: [codex/native-tcp-1.1.16]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned common library
        run: test "$(git -C libs/hbb_common rev-parse HEAD)" = 83419b6549636ee39dacef7776c473f5802e08d6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0
          components: rustfmt
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: native-tcp-1.1.16
          cache-on-failure: true
          cache-workspace-crates: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build and isolated test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev protobuf-compiler iproute2 util-linux
          python -m venv .test-venv
          .test-venv/bin/python -m pip install --disable-pip-version-check -r validation/requirements.txt
      - name: Rust handshake unit tests
        run: cargo test --locked --lib tcp_key_exchange::tests
      - name: Build actual server executables
        run: cargo build --locked --release --bin hbbs --bin hbbr
      - name: Real process protocol tests in a private network namespace
        run: |
          mkdir -p validation-results
          sudo "$PWD/.test-venv/bin/python" validation/protocol_blackbox.py --hbbs "$PWD/target/release/hbbs" --hbbr "$PWD/target/release/hbbr" --report "$PWD/validation-results/protocol-blackbox-result.json" --keep-logs
      - name: Package validated executables
        run: |
          mkdir -p dist
          cp target/release/hbbs target/release/hbbr dist/
          git rev-parse HEAD > dist/SOURCE_COMMIT
          printf '%s\n' 'Experimental native TCP compatibility build; not a complete RustDesk client or production deployment.' > dist/README.txt
          sha256sum dist/hbbs dist/hbbr > dist/SHA256SUMS
      - name: Upload protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-validation-${{ github.sha }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload validated server candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-1.1.16-native-tcp-linux-amd64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
